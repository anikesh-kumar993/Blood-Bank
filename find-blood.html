<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find Blood Donors - Search by blood group, location, and availability">
  <title>Find Blood | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-header">
    <h1><i class="fas fa-search me-2"></i> Find Blood Donors</h1>
    <p>Search for available donors by blood group</p>
  </div>

  <div class="container" style="margin-top:-30px;position:relative;z-index:10;padding-bottom:60px">
    <!-- Search Form -->
    <div class="dashboard-card mb-4">
      <form id="searchForm" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Blood Group</label>
          <select class="form-select" id="searchBloodGroup">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Availability</label>
          <select class="form-select" id="searchAvailable">
            <option value="true">Available Only</option>
            <option value="">All Donors</option>
          </select>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-red w-100">
            <i class="fas fa-search me-1"></i> Search Donors
          </button>
        </div>
      </form>
    </div>

    <!-- Results -->
    <div id="searchResults">
      <div class="text-center py-5">
        <i class="fas fa-search" style="font-size:3rem;color:var(--gray-300)"></i>
        <h5 class="mt-3 text-muted">Search for blood donors</h5>
        <p class="text-muted">Select a blood group and click search</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./findBlood.js"></script>
</body>
</html>
