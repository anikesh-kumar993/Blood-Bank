<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Dashboard - Manage donors, hospitals, blood requests, and view analytics">
  <title>Admin Dashboard | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-header">
    <h1><i class="fas fa-shield-alt me-2"></i> Admin Dashboard</h1>
    <p>Platform management and analytics</p>
  </div>

  <div class="container" style="margin-top:-30px;position:relative;z-index:10;padding-bottom:60px">
    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-lg-3 col-md-6"><div class="dashboard-card"><div class="dashboard-stat"><div class="dashboard-stat-icon red"><i class="fas fa-users"></i></div><div><span class="dashboard-stat-value" id="aDonors">0</span><span class="dashboard-stat-label">Total Donors</span></div></div></div></div>
      <div class="col-lg-3 col-md-6"><div class="dashboard-card"><div class="dashboard-stat"><div class="dashboard-stat-icon blue"><i class="fas fa-hospital"></i></div><div><span class="dashboard-stat-value" id="aHospitals">0</span><span class="dashboard-stat-label">Hospitals</span></div></div></div></div>
      <div class="col-lg-3 col-md-6"><div class="dashboard-card"><div class="dashboard-stat"><div class="dashboard-stat-icon orange"><i class="fas fa-file-medical"></i></div><div><span class="dashboard-stat-value" id="aRequests">0</span><span class="dashboard-stat-label">Total Requests</span></div></div></div></div>
      <div class="col-lg-3 col-md-6"><div class="dashboard-card"><div class="dashboard-stat"><div class="dashboard-stat-icon green"><i class="fas fa-check-double"></i></div><div><span class="dashboard-stat-value" id="aFulfilled">0</span><span class="dashboard-stat-label">Fulfilled</span></div></div></div></div>
    </div>

    <!-- Blood Group Distribution -->
    <div class="dashboard-card mb-4">
      <h5 class="mb-3"><i class="fas fa-chart-bar text-danger me-2"></i> Blood Group Distribution</h5>
      <div id="bloodGroupChart" class="d-flex flex-wrap gap-3 justify-content-center"></div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-pills mb-3 gap-2" role="tablist">
      <li class="nav-item"><button class="nav-link active rounded-pill" data-bs-toggle="pill" data-bs-target="#donorsTab">Donors</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" data-bs-toggle="pill" data-bs-target="#requestsTab">Requests</button></li>
      <li class="nav-item"><button class="nav-link rounded-pill" data-bs-toggle="pill" data-bs-target="#hospitalsTab">Hospitals</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="donorsTab">
        <div class="dashboard-card">
          <h5 class="mb-3">Registered Donors</h5>
          <div id="adminDonorsList"><div class="loading-spinner"><div class="spinner-blood"></div></div></div>
        </div>
      </div>
      <div class="tab-pane fade" id="requestsTab">
        <div class="dashboard-card">
          <h5 class="mb-3">All Blood Requests</h5>
          <div id="adminRequestsList"><div class="loading-spinner"><div class="spinner-blood"></div></div></div>
        </div>
      </div>
      <div class="tab-pane fade" id="hospitalsTab">
        <div class="dashboard-card">
          <h5 class="mb-3">Registered Hospitals</h5>
          <div id="adminHospitalsList"><div class="loading-spinner"><div class="spinner-blood"></div></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
