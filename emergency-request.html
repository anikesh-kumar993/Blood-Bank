<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Emergency Blood Request - Submit urgent blood requests and notify donors instantly">
  <title>Emergency Request | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-header" style="background:linear-gradient(135deg,#C62828,#B71C1C,#880E0E)">
    <h1><i class="fas fa-ambulance me-2 emergency-pulse"></i> Emergency Blood Request</h1>
    <p>Submit an urgent request — matching donors will be notified immediately</p>
  </div>

  <div class="container" style="margin-top:-30px;position:relative;z-index:10;padding-bottom:120px;margin-bottom:60px">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Emergency Alert Banner -->
        <div class="emergency-alert mb-4 text-center" style="position:relative">
          <div style="position:relative;z-index:2">
            <i class="fas fa-exclamation-triangle fa-2x mb-2"></i>
            <h5 class="text-white mb-2">For Life-Threatening Emergencies</h5>
            <div class="d-inline-block bg-white bg-opacity-25 rounded-pill px-4 py-2 mb-3">
              <h4 class="mb-0 text-white fw-bold"><i class="fas fa-phone-alt me-2"></i> Helpline: 9565356383</h4>
            </div>
            <p class="mb-0 text-white-50" style="font-size:0.95rem">
              Emergency requests automatically notify all matching donors in the network. Available 24/7.
            </p>
          </div>
        </div>

        <div class="dashboard-card">
          <h5 class="mb-4"><i class="fas fa-file-medical text-danger me-2"></i> Emergency Request Form</h5>
          <form id="emergencyForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Patient Name *</label>
                <input type="text" class="form-control" id="emPatientName" required placeholder="Enter patient name">
              </div>
              <div class="col-md-6">
                <label class="form-label">Contact Number *</label>
                <input type="tel" class="form-control" id="emPhone" required placeholder="Enter phone number">
              </div>
              <div class="col-md-4">
                <label class="form-label">Blood Group Required *</label>
                <select class="form-select" id="emBloodGroup" required>
                  <option value="">Select</option>
                  <option value="A+">A+</option><option value="A-">A-</option>
                  <option value="B+">B+</option><option value="B-">B-</option>
                  <option value="AB+">AB+</option><option value="AB-">AB-</option>
                  <option value="O+">O+</option><option value="O-">O-</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Units Needed *</label>
                <input type="number" class="form-control" id="emUnits" min="1" max="10" value="1" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Urgency</label>
                <div class="form-control bg-danger bg-opacity-10 border-danger text-danger fw-bold text-center">
                  <i class="fas fa-exclamation-triangle me-1"></i> EMERGENCY
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Hospital Name *</label>
                <input type="text" class="form-control" id="emHospital" required placeholder="Enter hospital name">
              </div>
              <div class="col-12">
                <label class="form-label">Additional Notes</label>
                <textarea class="form-control" id="emNotes" rows="3" placeholder="Any additional information (ward number, specific requirements, etc.)"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-3 mt-4 fw-bold" style="font-size:1.1rem" id="emSubmitBtn">
              <i class="fas fa-paper-plane me-2"></i> SUBMIT EMERGENCY REQUEST
            </button>
          </form>
        </div>

        <!-- Result panel -->
        <div id="emergencyResult" style="display:none" class="mt-4"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./emergency.js"></script>
</body>
</html>
