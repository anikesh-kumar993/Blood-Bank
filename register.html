<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register as a blood donor, patient, or hospital on Digital Blood Network">
  <title>Register | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card" style="max-width:600px">
      <div class="text-center mb-4">
        <a href="./index.html" class="navbar-brand justify-content-center mb-3" style="display:flex">
          <i class="fas fa-heartbeat"></i> BloodNet
        </a>
        <h2>Create Account</h2>
        <p class="subtitle">Join our life-saving network today</p>
      </div>

      <!-- Role Selection -->
      <div class="d-flex gap-2 mb-4 justify-content-center flex-wrap">
        <button class="btn btn-outline-danger rounded-pill px-4 role-btn active" data-role="donor" onclick="selectRole('donor')">
          <i class="fas fa-hand-holding-heart me-1"></i> Donor
        </button>
        <button class="btn btn-outline-danger rounded-pill px-4 role-btn" data-role="patient" onclick="selectRole('patient')">
          <i class="fas fa-user-injured me-1"></i> Patient
        </button>
        <button class="btn btn-outline-danger rounded-pill px-4 role-btn" data-role="hospital" onclick="selectRole('hospital')">
          <i class="fas fa-hospital me-1"></i> Hospital
        </button>
      </div>

      <form id="registerForm">
        <input type="hidden" id="registerRole" value="donor">

        <!-- Common Fields -->
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="regName" placeholder="Enter full name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email Address *</label>
            <input type="email" class="form-control" id="regEmail" placeholder="Enter email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" id="regPhone" placeholder="Enter phone" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password *</label>
            <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters" required minlength="6">
          </div>
        </div>

        <!-- Donor-specific Fields -->
        <div id="donorFields" class="mt-3">
          <hr class="my-3">
          <h6 class="text-muted mb-3"><i class="fas fa-tint me-1 text-danger"></i> Donor Details</h6>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Blood Group *</label>
              <select class="form-select" id="regBloodGroup">
                <option value="">Select</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Age *</label>
              <input type="number" class="form-control" id="regAge" placeholder="Age" min="18" max="65">
            </div>
            <div class="col-md-4">
              <label class="form-label">Gender *</label>
              <select class="form-select" id="regGender">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" id="regAddress" placeholder="Enter your address">
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Donation Date</label>
              <input type="date" class="form-control" id="regLastDonation">
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <button type="button" class="btn btn-outline-secondary w-100" onclick="getLocation()">
                <i class="fas fa-map-marker-alt me-1"></i> Detect My Location
              </button>
            </div>
            <input type="hidden" id="regLat" value="0">
            <input type="hidden" id="regLng" value="0">
            <div id="locationStatus" class="col-12" style="display:none">
              <small class="text-success"><i class="fas fa-check-circle me-1"></i> <span id="locationText">Location detected</span></small>
            </div>
          </div>
        </div>

        <!-- Hospital-specific Fields -->
        <div id="hospitalFields" class="mt-3" style="display:none">
          <hr class="my-3">
          <h6 class="text-muted mb-3"><i class="fas fa-hospital me-1 text-danger"></i> Hospital Details</h6>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Hospital Name *</label>
              <input type="text" class="form-control" id="regHospitalName" placeholder="Enter hospital name">
            </div>
            <div class="col-12">
              <label class="form-label">Hospital Address *</label>
              <input type="text" class="form-control" id="regHospitalAddress" placeholder="Enter hospital address">
            </div>
          </div>
        </div>

        <div class="form-check mt-4">
          <input type="checkbox" class="form-check-input" id="agreeTerms" required>
          <label class="form-check-label" for="agreeTerms" style="font-size:0.9rem">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-red w-100 py-3 mt-3" id="registerBtn">
          <i class="fas fa-user-plus me-2"></i> Create Account
        </button>
      </form>

      <div class="text-center mt-4">
        <p style="color:var(--gray-600);font-size:0.95rem">
          Already have an account? <a href="./login.html" class="fw-bold">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
