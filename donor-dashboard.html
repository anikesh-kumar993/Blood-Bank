<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Donor Dashboard - View your blood group, donation history, and emergency requests">
  <title>Donor Dashboard | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Page Header -->
  <div class="page-header">
    <h1><i class="fas fa-hand-holding-heart me-2"></i> Donor Dashboard</h1>
    <p>Manage your donor profile and respond to blood requests</p>
  </div>

  <div class="container" style="margin-top:-30px;position:relative;z-index:10;padding-bottom:60px">
    <!-- Profile Card -->
    <div class="row g-4 mb-4">
      <div class="col-lg-4">
        <div class="dashboard-card text-center">
          <div class="blood-badge blood-badge-lg mx-auto mb-3" id="userBloodGroup">--</div>
          <h4 id="userName">Loading...</h4>
          <p class="text-muted mb-3" id="userEmail">--</p>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-danger btn-sm rounded-pill" id="availabilityBtn" onclick="toggleAvailability()">
              <i class="fas fa-toggle-on me-1"></i> <span id="availabilityText">Available</span>
            </button>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="row g-3">
          <div class="col-md-6">
            <div class="dashboard-card">
              <div class="dashboard-stat">
                <div class="dashboard-stat-icon red"><i class="fas fa-tint"></i></div>
                <div>
                  <span class="dashboard-stat-value" id="totalDonations">0</span>
                  <span class="dashboard-stat-label">Total Donations</span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="dashboard-card">
              <div class="dashboard-stat">
                <div class="dashboard-stat-icon green"><i class="fas fa-calendar-check"></i></div>
                <div>
                  <span class="dashboard-stat-value" id="lastDonation">N/A</span>
                  <span class="dashboard-stat-label">Last Donation</span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="dashboard-card">
              <div class="dashboard-stat">
                <div class="dashboard-stat-icon orange"><i class="fas fa-exclamation-triangle"></i></div>
                <div>
                  <span class="dashboard-stat-value" id="nearbyRequests">0</span>
                  <span class="dashboard-stat-label">Nearby Requests</span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="dashboard-card">
              <div class="dashboard-stat">
                <div class="dashboard-stat-icon blue"><i class="fas fa-check-circle"></i></div>
                <div>
                  <span class="dashboard-stat-value" id="nextEligible">--</span>
                  <span class="dashboard-stat-label">Next Eligible Date</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Emergency Requests Section -->
    <div class="dashboard-card mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="fas fa-ambulance text-danger me-2"></i> Emergency Requests Nearby</h5>
        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="loadNearbyRequests()">
          <i class="fas fa-sync-alt me-1"></i> Refresh
        </button>
      </div>
      <div id="emergencyRequestsList">
        <div class="loading-spinner">
          <div class="spinner-blood"></div>
        </div>
      </div>
    </div>

    <!-- Donation History -->
    <div class="dashboard-card">
      <h5 class="mb-3"><i class="fas fa-history text-danger me-2"></i> Donation History</h5>
      <div id="donationHistory">
        <div class="empty-state">
          <i class="fas fa-heart"></i>
          <h5>No donations yet</h5>
          <p>Your donation history will appear here</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./donor.js"></script>
</body>
</html>
