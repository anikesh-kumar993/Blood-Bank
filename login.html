<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to Digital Blood Network - Access your donor, patient, or hospital dashboard">
  <title>Login | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="./index.html" class="navbar-brand justify-content-center mb-3" style="display:flex">
          <i class="fas fa-heartbeat"></i> BloodNet
        </a>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your account to continue</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
            <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="input-group-text bg-white border-start-0" onclick="togglePassword('loginPassword', this)">
              <i class="fas fa-eye text-muted"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe" style="font-size:0.9rem">Remember me</label>
          </div>
          <a href="#" style="font-size:0.9rem">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-red w-100 py-3" id="loginBtn">
          <i class="fas fa-sign-in-alt me-2"></i> Login
        </button>
      </form>

      <div class="text-center mt-4">
        <p style="color:var(--gray-600);font-size:0.95rem">
          Don't have an account? <a href="./register.html" class="fw-bold">Register here</a>
        </p>
      </div>

      <!-- Demo Credentials Info -->
      <div class="mt-4 p-3 rounded-3" style="background:rgba(211,47,47,0.05);border:1px solid rgba(211,47,47,0.1)">
        <p class="mb-0 text-center" style="font-size:0.85rem;color:var(--gray-600)">
          <i class="fas fa-info-circle text-danger me-1"></i>
          New user? <a href="./register.html">Create an account</a> to get started
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
