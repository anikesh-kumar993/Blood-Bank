<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hospital Management Panel - Manage blood requests, inventory, and patient records">
  <title>Hospital Dashboard | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-header">
    <h1><i class="fas fa-hospital me-2"></i> Hospital Dashboard</h1>
    <p>Manage blood requests and inventory</p>
  </div>

  <div class="container" style="margin-top:-30px;position:relative;z-index:10;padding-bottom:60px">
    <!-- Stats Row -->
    <div class="row g-3 mb-4">
      <div class="col-lg-3 col-md-6">
        <div class="dashboard-card">
          <div class="dashboard-stat">
            <div class="dashboard-stat-icon red"><i class="fas fa-list"></i></div>
            <div><span class="dashboard-stat-value" id="hTotalReq">0</span><span class="dashboard-stat-label">Total Requests</span></div>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="dashboard-card">
          <div class="dashboard-stat">
            <div class="dashboard-stat-icon orange"><i class="fas fa-clock"></i></div>
            <div><span class="dashboard-stat-value" id="hPendingReq">0</span><span class="dashboard-stat-label">Pending</span></div>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="dashboard-card">
          <div class="dashboard-stat">
            <div class="dashboard-stat-icon green"><i class="fas fa-check"></i></div>
            <div><span class="dashboard-stat-value" id="hApprovedReq">0</span><span class="dashboard-stat-label">Approved</span></div>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6">
        <div class="dashboard-card">
          <div class="dashboard-stat">
            <div class="dashboard-stat-icon blue"><i class="fas fa-ambulance"></i></div>
            <div><span class="dashboard-stat-value" id="hEmergencyReq">0</span><span class="dashboard-stat-label">Emergency</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Blood Inventory -->
      <div class="col-lg-4">
        <div class="dashboard-card">
          <h5 class="mb-3"><i class="fas fa-vials text-danger me-2"></i> Blood Inventory</h5>
          <form id="inventoryForm">
            <div class="row g-2">
              <div class="col-6"><label class="form-label small">A+</label><input type="number" class="form-control form-control-sm" id="inv_Apos" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">A-</label><input type="number" class="form-control form-control-sm" id="inv_Aneg" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">B+</label><input type="number" class="form-control form-control-sm" id="inv_Bpos" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">B-</label><input type="number" class="form-control form-control-sm" id="inv_Bneg" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">AB+</label><input type="number" class="form-control form-control-sm" id="inv_ABpos" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">AB-</label><input type="number" class="form-control form-control-sm" id="inv_ABneg" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">O+</label><input type="number" class="form-control form-control-sm" id="inv_Opos" min="0" value="0"></div>
              <div class="col-6"><label class="form-label small">O-</label><input type="number" class="form-control form-control-sm" id="inv_Oneg" min="0" value="0"></div>
            </div>
            <button type="submit" class="btn btn-red btn-sm w-100 mt-3">
              <i class="fas fa-save me-1"></i> Update Inventory
            </button>
          </form>
        </div>
      </div>

      <!-- Blood Requests -->
      <div class="col-lg-8">
        <div class="dashboard-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0"><i class="fas fa-list-alt text-danger me-2"></i> Blood Requests</h5>
            <select class="form-select form-select-sm" style="width:auto" id="requestFilter" onchange="loadHospitalRequests()">
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div id="hospitalRequestsList">
            <div class="loading-spinner"><div class="spinner-blood"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./hospital.js"></script>
</body>
</html>
