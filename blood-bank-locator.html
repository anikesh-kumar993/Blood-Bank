<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find blood banks and hospitals near you using GPS">
  <title>Blood Bank Locator | Digital Blood Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-header">
    <h1><i class="fas fa-map-marked-alt me-2"></i> Blood Bank Locator</h1>
    <p>Find nearby blood banks and hospitals using GPS</p>
  </div>

  <div class="container" style="margin-top:-30px;position:relative;z-index:10;padding-bottom:60px">
    <!-- Controls -->
    <div class="dashboard-card mb-4">
      <div class="row align-items-center g-3">
        <div class="col-md-7">
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <button class="btn btn-red" onclick="detectLocation()" id="detectBtn">
              <i class="fas fa-crosshairs me-1"></i> Detect My Location
            </button>
            <span class="text-muted" id="locationInfo">Click to detect your location</span>
          </div>
        </div>
        <div class="col-md-5">
          <div class="d-flex gap-2">
            <select class="form-select border-danger" id="filterBloodGroup" onchange="filterHospitals()" style="max-width: 130px; border-width: 2px;">
              <option value="">Any Type</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
            <div class="input-group">
              <input type="text" class="form-control" id="searchLocation" placeholder="Enter city or area...">
              <button class="btn btn-danger" onclick="searchOnMap()">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-container mb-4">
      <div id="map"></div>
    </div>

    <!-- Registered Hospitals List -->
    <div class="dashboard-card">
      <h5 class="mb-3"><i class="fas fa-hospital text-danger me-2"></i> Registered Blood Banks & Hospitals</h5>
      <div id="hospitalsList">
        <div class="loading-spinner"><div class="spinner-blood"></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
  <script src="./map.js"></script>
</body>
</html>
